<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="meta-description" name="description" content="">
  <title></title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="hero-branding">
        <div id="brand-image-wrap" class="brand-image-wrap" hidden>
          <img id="brand-image" class="brand-image" alt="">
        </div>

        <div class="hero-copy">
          <h1 id="pool-title"></h1>
          <p id="pool-intro" class="subtitle"></p>
        </div>
      </div>

      <div class="summary" aria-live="polite">
        <div>
          <span id="open-count" class="summary-number">25</span>
          <span id="open-count-label" class="summary-label"></span>
        </div>
        <div>
          <span id="claimed-count" class="summary-number">0</span>
          <span id="claimed-count-label" class="summary-label"></span>
        </div>
      </div>
    </section>

    <section class="content-card" aria-labelledby="spots-heading">
      <div class="section-heading">
        <div>
          <h2 id="spots-heading"></h2>
          <p id="spots-help"></p>
        </div>
        <div class="section-actions">
          <span id="admin-badge" class="admin-badge" hidden></span>
          <button id="admin-button" class="secondary-button" type="button"></button>
          <button id="refresh-button" class="secondary-button" type="button"></button>
        </div>
      </div>

      <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
      <div id="spots-grid" class="spots-grid" aria-live="polite"></div>
    </section>

    <footer>
      <span id="footer-text"></span>
      <span id="last-updated"></span>
    </footer>
  </main>

  <dialog id="signup-dialog" class="signup-dialog">
    <form id="signup-form" method="dialog">
      <button class="icon-button dialog-close" type="button" aria-label="">&times;</button>
      <h2 id="claim-dialog-title"></h2>
      <p id="claim-dialog-copy" class="dialog-copy"></p>

      <label id="claim-name-label" for="participant-name"></label>
      <input id="participant-name" name="participant-name" type="text" maxlength="80" autocomplete="name" required>
      <input id="selected-spot" type="hidden">

      <div id="form-error" class="form-error" role="alert"></div>
      <button id="submit-button" class="primary-button" type="submit"></button>
    </form>
  </dialog>

  <dialog id="admin-login-dialog" class="signup-dialog">
    <form id="admin-login-form" method="dialog">
      <button class="icon-button dialog-close" type="button" aria-label="">&times;</button>
      <h2 id="admin-login-title"></h2>
      <p id="admin-login-copy" class="dialog-copy"></p>

      <label id="admin-password-label" for="admin-password"></label>
      <input id="admin-password" name="admin-password" type="password" autocomplete="current-password" required>

      <div id="admin-login-error" class="form-error" role="alert"></div>
      <button id="admin-unlock-button" class="primary-button" type="submit"></button>
    </form>
  </dialog>

  <dialog id="admin-edit-dialog" class="signup-dialog">
    <form id="admin-edit-form" method="dialog">
      <button class="icon-button dialog-close" type="button" aria-label="">&times;</button>
      <h2 id="admin-edit-title"></h2>
      <p id="admin-edit-copy" class="dialog-copy"></p>

      <label id="admin-name-label" for="admin-participant-name"></label>
      <input id="admin-participant-name" name="admin-participant-name" type="text" maxlength="80" autocomplete="off" required>
      <input id="admin-selected-spot" type="hidden">

      <div id="admin-edit-error" class="form-error" role="alert"></div>
      <div class="admin-edit-actions">
        <button id="admin-save-button" class="primary-button" type="submit"></button>
        <button id="admin-remove-button" class="danger-button" type="button"></button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
